services:
  ninjatrader:
    build: .
    container_name: ninjatrader-merlot
    ports:
      - "6080:6080"
      - "5900:5900"
    volumes:
      - type: bind
        source: "${NT_CONFIG_PATH}"
        target: /tmp/host_config.xml
        read_only: true
      - ./screenshots:/home/ninjatrader/screenshots
    environment:
      - VNC_PASSWORD=${VNC_PASSWORD:-}
      - HOST_MACHINE_GUID=${HOST_MACHINE_GUID:-}
