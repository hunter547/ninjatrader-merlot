services:
  ninjatrader:
    build: .
    image: ninjatrader-merlot
    container_name: ninjatrader-merlot
    ports:
      - "6080:6080"
      - "5900:5900"
    volumes:
      - type: bind
        source: "${NT_CONFIG_PATH}"
        target: /tmp/host_config.xml
        read_only: true
      - ./screenshots:/home/ninjatrader/screenshots
      - ./ninjatrader-data:/home/ninjatrader/.wine/drive_c/users/ninjatrader/Documents/NinjaTrader 8
    environment:
      - VNC_PASSWORD=${VNC_PASSWORD:-}
      - HOST_MACHINE_GUID=${HOST_MACHINE_GUID:-}

  ninjatrader-auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    image: ninjatrader-auth
    container_name: ninjatrader-auth
    ports:
      - "6081:6080"
      - "5901:5900"
    environment:
      - VNC_PASSWORD=${VNC_PASSWORD:-}
      - NT_USERNAME=${NT_USERNAME:-}
      - NT_PASSWORD=${NT_PASSWORD:-}
    profiles:
      - auth
